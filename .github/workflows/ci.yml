# Continuous integration for pull requests into `development` (backlog B-01).
#
# Runs only checks that already exist in the repository, so a green run means
# the same thing it meant when run by hand:
#   - app:            TypeScript type check, unit tests, production build
#   - database:       every SQL behaviour suite in tests/sql (migrations replayed on
#                     in-memory PGlite; no Supabase project is contacted)
#   - edge-functions: `deno check` on every Edge Function
#
# Passing tests are not proof that every authorization path is secure; they prove
# the paths the suites name. See tests/sql/README.md for what each suite covers.
#
# The workflow needs no secrets and has read-only repository permissions.

name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Pinned: tests/sql/README.md documents this exact version. It is installed
  # with --no-save because it is deliberately not a project dependency.
  PGLITE_VERSION: '0.2.17'

jobs:
  app:
    name: Type check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  database:
    name: SQL behaviour suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm i --no-save --no-audit --no-fund "@electric-sql/pglite@${PGLITE_VERSION}"
      - name: Run every suite in tests/sql
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          suites=(tests/sql/*.test.mjs)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::No SQL suites found in tests/sql"
            exit 1
          fi
          failed=()
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            if node "${suite}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${suite}::${suite} failed"
              failed+=("${suite}")
            fi
          done
          echo "Ran ${#suites[@]} suites; ${#failed[@]} failed."
          if [ ${#failed[@]} -gt 0 ]; then
            printf '  failed: %s\n' "${failed[@]}"
            exit 1
          fi

  edge-functions:
    name: Edge Function type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: deno check
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(supabase/functions/*/index.ts)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::error::No Edge Functions found"
            exit 1
          fi
          deno check "${entries[@]}"
